name: Build IRHFIN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract IRHFIN source
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -o IRHFIN_v0.3_ANDROID_WEB_SOURCE.zip -d extracted

      - name: Find Android project
        shell: bash
        run: |
          set -e
          FILE=$(find "$GITHUB_WORKSPACE/extracted" -type f \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Android project files not found in ZIP."
            find extracted -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$FILE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -e
          gradle --version
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRHFIN-Android-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
