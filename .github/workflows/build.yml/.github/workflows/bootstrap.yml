name: Extract IRHFIN and Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository and locate ZIP
        shell: bash
        run: |
          set -e
          echo "Repository files:"
          find . -maxdepth 5 -type f \
            ! -path './.git/*' | head -n 200

          ZIP_FILE="$(find . -type f \
            -iname '*.zip' \
            ! -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file exists in this repository."
            echo "Upload the actual Android source ZIP to the repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          GRADLEW="$(find extracted -type f \
            -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: ZIP contains no gradlew file."
            echo "ZIP contents:"
            find extracted -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRHFIN-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
