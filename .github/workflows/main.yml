name: Extract IRHFIN and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract IRHFIN source ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found in repository."
            exit 1
          fi

          echo "Using source ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Android project
        shell: bash
        run: |
          set -e

          APP_BUILD=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \( -path "*/app/build.gradle" \
            -o -path "*/app/build.gradle.kts" \) \
            | head -n 1)

          if [ -z "$APP_BUILD" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_BUILD")")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Check APK output
        shell: bash
        run: |
          set -e
          find "$PROJECT_DIR" \
            -type f -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRHFIN-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
