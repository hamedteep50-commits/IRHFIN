name: Build IRHFIN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: Project ZIP not found'
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted
          echo 'ZIP extraction completed.'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=''
          while IFS= read -r SETTINGS; do
            DIR=$(dirname "$SETTINGS")
            if { [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; } && { [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; }; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \))
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: Android project not found in ZIP'
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(printf '%s' "$PROJECT_DIR" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Configure Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRHFIN-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
