
name: Extract IRHFIN and Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No source ZIP found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          SETTINGS="$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found."
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          cp -a "$ROOT"/. .
          test -f settings.gradle || test -f settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRHFIN-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
