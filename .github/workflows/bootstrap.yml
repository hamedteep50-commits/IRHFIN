name: Build IRHFIN Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract IRHFIN ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'IRHFIN*.zip' ! -path './.git/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: IRHFIN source ZIP not found"
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted
          test -f extracted/settings.gradle || test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle || test -f extracted/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: gradle wrapper --gradle-version 8.6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRHFIN-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
