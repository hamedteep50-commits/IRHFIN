name: Build IRHFIN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: No project ZIP found'
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted
          echo 'ZIP extraction completed.'

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=''
          while IFS= read -r SETTINGS; do
            DIR=$(dirname "$SETTINGS")
            if { [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; } && { [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; }; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \))
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: No valid Android project found inside ZIP'
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRHFIN-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
