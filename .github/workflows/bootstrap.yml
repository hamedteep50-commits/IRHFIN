name: Build IRHFIN APK

on:
push:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Locate Android project
    shell: bash
    run: |
      set -e
      if [ -f settings.gradle ] && [ -f app/build.gradle ]; then
        PROJECT_DIR="."
      elif [ -f extracted/settings.gradle ] && [ -f extracted/app/build.gradle ]; then
        PROJECT_DIR="extracted"
      else
        echo "ERROR: Android project files not found"
        find . -maxdepth 4 -type f | head -200
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.6'

  - name: Build debug APK
    working-directory: ${{ env.PROJECT_DIR }}
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: IRHFIN-debug-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
